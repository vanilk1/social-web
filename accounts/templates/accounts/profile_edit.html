{% extends "accounts/base.html" %}
{% block title %}Редагування профілю{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-6">
    <div class="card">
      <div class="card-header d-flex align-items-center gap-2">
        <a href="{% url 'accounts:profile' user.pk %}" class="tbtn"><i class="bi bi-arrow-left"></i></a>
        <span class="fw-bold">Редагування профілю</span>
      </div>
      <div class="card-body p-4">
        <form method="post" novalidate>
          {% csrf_token %}
          {% for field in form %}
          <div class="mb-3">
            <label class="form-label fw-semibold small">{{ field.label }}</label>
            {{ field }}
            {% if field.errors %}
            <div class="text-danger small mt-1">{% for e in field.errors %}{{ e }}{% endfor %}</div>
            {% endif %}
          </div>
          {% endfor %}
          <div class="d-flex gap-2 justify-content-end mt-4">
            <a href="{% url 'accounts:profile' user.pk %}" class="btn btn-sm" style="border-radius:10px;background:var(--bg)">Скасувати</a>
            <button type="submit" class="btn btn-primary btn-sm px-4" style="border-radius:10px">
              <i class="bi bi-check-lg me-1"></i>Зберегти
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
